<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:80px 1fr 90px;gap:14px;align-items:center;font-size:10px;color:var(--text-muted);letter-spacing:.05em}
.name{color:var(--text);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.bar{height:10px;background:var(--accent)}
.px{text-align:right;font-size:9px}
</style></head>
<body><div class="wrap">
 <div class="row"><div class="name">space-2</div><div><div class="bar" style="width:8px"></div></div><div class="px">8 px · 0.5rem</div></div>
 <div class="row"><div class="name">space-4</div><div><div class="bar" style="width:16px"></div></div><div class="px">16 px · 1rem</div></div>
 <div class="row"><div class="name">space-6</div><div><div class="bar" style="width:24px"></div></div><div class="px">24 px · 1.5rem</div></div>
 <div class="row"><div class="name">space-8</div><div><div class="bar" style="width:32px"></div></div><div class="px">32 px · 2rem</div></div>
 <div class="row"><div class="name">space-12</div><div><div class="bar" style="width:48px"></div></div><div class="px">48 px · 3rem</div></div>
 <div class="row"><div class="name">space-16</div><div><div class="bar" style="width:64px"></div></div><div class="px">64 px · 4rem</div></div>
 <div class="row"><div class="name">space-24</div><div><div class="bar" style="width:96px"></div></div><div class="px">96 px · 6rem (section)</div></div>
</div></body></html>
