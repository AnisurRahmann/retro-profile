<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:16px 24px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(10,10,10,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-size:13px;letter-spacing:.05em;color:var(--text);font-weight:500}
.logo .d{color:var(--accent)}
.links{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.link{font-size:10px;color:var(--text-muted);text-decoration:none;text-transform:uppercase;letter-spacing:.15em;transition:color .3s}
.link:hover,.link.active{color:var(--accent)}
.note{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:12px;padding-left:20px}
</style></head>
<body><div class="wrap">
 <div class="nav">
   <div class="logo">ar<span class="d">.</span>shakil</div>
   <ul class="links">
     <li><a class="link" href="#">Now</a></li>
     <li><a class="link active" href="#">Projects</a></li>
     <li><a class="link" href="#">Writing</a></li>
     <li><a class="link" href="#">About</a></li>
     <li><a class="link" href="#">Contact</a></li>
   </ul>
 </div>
 <div class="note">Fixed top · backdrop-blur 10px · hairline bottom border · hover → accent</div>
</div></body></html>
