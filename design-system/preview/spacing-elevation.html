<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{padding:18px;height:84px;position:relative}
.l1{background:var(--bg);border:1px solid var(--border)}
.l2{background:var(--bg-elevated);border:1px solid var(--border)}
.l3{background:var(--bg-elevated);border:1px solid var(--accent)}
.name{font-size:10px;color:var(--text);letter-spacing:.1em;text-transform:uppercase}
.note{font-size:9px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.dot{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(34,197,94,.25)}
</style></head>
<body><div class="wrap">
 <div class="card l1"><div class="name">Canvas</div><div class="note">bg · flat, no shadow</div></div>
 <div class="card l2"><div class="name">Elevated</div><div class="note">bg-elevated · hairline border</div></div>
 <div class="card l3"><span class="dot"></span><div class="name" style="color:var(--accent)">Hover / Active</div><div class="note">Border flips to accent · optional translateY(-2px)</div></div>
</div></body></html>
