<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Writing row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:16px 20px;display:flex;flex-direction:column}
.feat{background:linear-gradient(90deg,rgba(34,197,94,.1) 0%,transparent 100%);border-left:3px solid var(--accent);padding:18px;margin-bottom:10px}
.cat{font-size:9px;padding:3px 7px;background:rgba(34,197,94,.15);color:var(--accent);text-transform:uppercase;letter-spacing:.1em;border-radius:2px;margin-right:8px}
.fbadge{font-size:9px;padding:3px 7px;background:var(--accent);color:#0a0a0a;text-transform:uppercase;letter-spacing:.1em}
.title{font-family:'Instrument Serif',Georgia,serif;font-size:18px;color:var(--text);display:block;margin-top:6px}
.row{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.date{font-size:10px;color:var(--text-muted)}
.rtitle{font-family:'Instrument Serif',Georgia,serif;font-size:15px}
.rcat{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em}
</style></head>
<body><div class="wrap">
 <div class="feat">
   <span class="cat">AI Engineering</span><span class="fbadge">Featured</span>
   <span class="title">Building Production-Ready AI Agents</span>
 </div>
 <div class="row"><span class="date">Mar 2025</span><span class="rtitle">AICP: A Wire-Format Compression Protocol for LLMs</span><span class="rcat">Research</span></div>
</div></body></html>
