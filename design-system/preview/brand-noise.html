<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Noise texture</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:22px 24px;position:relative;min-height:200px}
.wrap::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.lbl{font-size:10px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;margin-bottom:10px;position:relative}
.lbl::before{content:'';width:22px;height:1px;background:var(--accent)}
h{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:24px;color:var(--text);margin-bottom:8px;position:relative}
.note{font-size:10px;color:var(--text-muted);letter-spacing:.04em;line-height:1.6;position:relative}
</style></head>
<body><div class="wrap">
 <div class="lbl">Surface Texture</div>
 <h>Fractal noise overlay</h>
 <div class="note">SVG feTurbulence · baseFrequency 0.9 · opacity 0.03 (shown at 0.08 here) · fixed, pointer-events off · adds paper grain to the near-black canvas. <em>Only</em> global background treatment in the system.</div>
</div></body></html>
