<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Status indicators</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:22px 24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ind{display:inline-flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted);letter-spacing:.06em}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.4)}50%{opacity:.8;box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:12px;color:var(--accent);padding:9px 16px;background:rgba(34,197,94,.1);border:1px solid var(--accent)}
.cursor{display:inline-block;color:var(--accent);font-weight:300;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.note{font-size:9px;color:var(--text-muted);letter-spacing:.05em}
</style></head>
<body><div class="wrap">
 <div class="ind"><span class="dot"></span>Available for work</div>
 <div class="pill"><span class="dot"></span>Available for contracts &amp; full-time roles</div>
 <div class="ind"><span>AI Engineer<span class="cursor">|</span></span></div>
 <div class="note">Pulsing dot · availability pill · blinking typing cursor (1s step-end)</div>
</div></body></html>
