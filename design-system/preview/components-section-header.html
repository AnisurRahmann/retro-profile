<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Section header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:28px 28px}
.head{display:flex;align-items:center;gap:14px}
.badge{font-size:10px;padding:5px 10px;background:rgba(34,197,94,.1);border:1px solid var(--accent);color:var(--accent);text-transform:uppercase;letter-spacing:.2em}
.title{font-family:'Instrument Serif',Georgia,serif;font-size:28px;margin:0;color:var(--text)}
.line{flex:1;height:1px;background:var(--border)}
.note{font-size:9px;color:var(--text-muted);letter-spacing:.08em;margin-top:12px;text-transform:uppercase}
</style></head>
<body><div class="wrap">
 <div class="head">
   <span class="badge">Work</span>
   <h2 class="title">Selected Projects</h2>
   <div class="line"></div>
 </div>
 <div class="note">Badge · Serif title · Hairline extends to fill row</div>
</div></body></html>
