<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type — Stat numeral</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.wrap{padding:18px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.stat{background:var(--bg);padding:22px 14px}
.num{font-family:'Instrument Serif',Georgia,serif;font-size:48px;line-height:1;color:var(--text);display:block;margin-bottom:6px}
.num.g{color:var(--accent)}
.lbl{font-size:9px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;line-height:1.4}
</style></head>
<body><div class="wrap">
 <div class="stat"><span class="num g">$900K</span><div class="lbl">Saved per year via AI</div></div>
 <div class="stat"><span class="num g">$1M+</span><div class="lbl">Monthly GMV enabled</div></div>
 <div class="stat"><span class="num">80%</span><div class="lbl">Support time cut</div></div>
 <div class="stat"><span class="num">2.5K</span><div class="lbl">SEO posts / hour</div></div>
</div></body></html>
