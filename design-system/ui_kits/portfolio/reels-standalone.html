<!DOCTYPE html>
<html lang="en">
<head>

          fill="#0a0a0a" stroke="#262626" stroke-width="2"/>
    <rect x="560" y="130" width="80" height="16" rx="8" ry="8" fill="#000"/>
    <rect x="500" y="255" width="200" height="18" rx="2" fill="#fafafa"/>
    <rect x="500" y="285" width="180" height="18" rx="2" fill="#22c55e"/>
    <rect x="500" y="315" width="150" height="18" rx="2" fill="#fafafa"/>
    <rect x="500" y="370" width="200" height="6" rx="1" fill="#737373"/>
    <rect x="500" y="385" width="180" height="6" rx="1" fill="#737373"/>
    <rect x="500" y="400" width="140" height="6" rx="1" fill="#737373"/>
    <circle cx="708" cy="400" r="12" fill="none" stroke="#fafafa" stroke-width="1.4"/>
    <circle cx="708" cy="440" r="12" fill="none" stroke="#fafafa" stroke-width="1.4"/>
    <circle cx="708" cy="480" r="12" fill="none" stroke="#fafafa" stroke-width="1.4"/>
    <text x="600" y="755" fill="#22c55e" font-family="monospace" font-size="18"
          text-anchor="middle" letter-spacing="4">AR.SHAKIL · REELS</text>
  </svg>

<style>
  #tweaks-btn{
    position:fixed;right:20px;top:20px;z-index:998;
    background:#111;border:1px solid #262626;color:#fafafa;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em;
    padding:8px 12px;cursor:pointer;text-transform:uppercase;
  }
  #tweaks-btn:hover{border-color:#22c55e;color:#22c55e}
  @media (max-width:640px){ #tweaks-btn{top:auto;bottom:16px;right:16px} }
</style>
<style>
  /* Bulletproof sizing fallback — guarantees phone screen is a fixed viewport */
  .phone-screen > #app { height: 100% !important; display: block !important; overflow: hidden !important; }
  .phone-screen > #app > .reels { height: 100% !important; }
</style>
</head>
<body data-variant="editorial" data-transition="slide">

<button id="tweaks-btn" onclick="document.getElementById('tweaks').classList.toggle('open')">⚙ Tweaks</button>

<div class="stage">
  <div class="stage-meta"><span class="dot"/>SHAKIL · REELS · v1</div>
  <div class="stage-meta-r" id="stage-counter">01 / 11</div>

  <div class="phone">
    <div class="phone-screen">
      <div id="app"></div>
    </div>
  </div>
</div>

<!-- Tweaks panel -->
<div id="tweaks">
  <h4>Tweaks</h4>
  <div class="grp">
    <div class="lbl">Aesthetic</div>
    <label><input type="radio" name="variant" value="editorial" checked/> Editorial (serif)</label>
    <label><input type="radio" name="variant" value="terminal"/> Terminal (mono)</label>
  </div>
  <div class="grp">
    <div class="lbl">Transition</div>
    <label><input type="radio" name="transition" value="slide" checked/> Slide snap</label>
    <label><input type="radio" name="transition" value="fade"/> Crossfade</label>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="reels-chrome.jsx"></script>
<script type="text/babel" src="reels-actions.jsx"></script>
<script type="text/babel" src="reels-blogs.jsx"></script>
<script type="text/babel" src="reels-content.jsx"></script>

<script type="text/babel">
const { useEffect, useRef, useState } = React;

const TWEAKS = /*EDITMODE-BEGIN*/{
  "variant": "editorial",
  "transition": "slide"
}/*EDITMODE-END*/;

// Reel registry — order defines swipe sequence
const REELS = [
  { id:'hero',      label:'Intro',    render: () => <ReelHero/> },
  { id:'now',       label:'Now',      render: () => <ReelNow/> },
  { id:'stats',     label:'Impact',   render: () => <ReelStats/> },
  { id:'p-foxreach',label:'Project',  render: () => <ReelProject
      num="001" title="Fox" italic="reach"
      desc="AI outreach agent: multi-channel automation with LangGraph state machines and Bedrock-powered personalization."
      tags={['LangGraph','FastAPI','Bedrock']} /> },
  { id:'p-tabsense',label:'Project',  render: () => <ReelProject
      num="002" title="Tab" italic="sense"
      desc="Adaptive AI learning coach — curriculum generation, long-term memory over pgvector, and Next.js delivery."
      tags={['LangGraph','pgvector','Next.js']} /> },
  { id:'p-mvpkit',  label:'Project',  render: () => <ReelProject
      num="003" title="create-" italic="mvpkit"
      desc="CLI to scaffold production-ready AI MVPs in minutes — auth, vector DB, LLM wiring, and deploy out of the box."
      tags={['CLI','TypeScript','OSS']} /> },
  { id:'cos',       label:'Companies',render: () => <ReelCompanies/> },
  { id:'skills',    label:'Stack',    render: () => <ReelSkills/> },
  { id:'blogs',     label:'Blogs',    render: ({onOpenBlog}) => <ReelBlogs onOpen={onOpenBlog}/> },
  { id:'about',     label:'About',    render: () => <ReelAbout/> },
  { id:'contact',   label:'Contact',  render: () => <ReelContact/> },
];

function App() {
  const [active, setActive] = useState(() => {
    const n = parseInt(localStorage.getItem('reel-idx') || '0', 10);
    return Number.isFinite(n) && n >= 0 && n < REELS.length ? n : 0;
  });
  const trackRef = useRef(null);
  const reelRefs = useRef([]);
  const [mounted, setMounted] = useState(false);
  const [openBlogIdx, setOpenBlogIdx] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [socialsOpen, setSocialsOpen] = useState(false);

  const onOpenBlog = (i) => setOpenBlogIdx(i);
  const onCloseBlog = () => setOpenBlogIdx(null);
  const onToast = (m) => setToastMsg(m);
  const onOpenSocials = () => setSocialsOpen(true);
  const onCloseSocials = () => setSocialsOpen(false);

  // Restore scroll position on mount, then mark mounted so first reel animates
  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const el = reelRefs.current[active];
    if (el) track.scrollTop = el.offsetTop;
    // next frame: allow .active class to take effect and trigger animations
    requestAnimationFrame(() => setMounted(true));
  // eslint-disable-next-line
  }, []);

  // IntersectionObserver to detect active reel
  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach(e => {
          if (e.isIntersecting && e.intersectionRatio > 0.6) {
            const idx = Number(e.target.dataset.idx);
            setActive(idx);
            localStorage.setItem('reel-idx', String(idx));
          }
        });
      },
      { root: track, threshold: [0.6, 0.9] }
    );
    reelRefs.current.forEach(el => el && io.observe(el));
    return () => io.disconnect();
  }, []);

  // Keyboard nav
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') {
        e.preventDefault(); jump(Math.min(active+1, REELS.length-1));
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k') {
        e.preventDefault(); jump(Math.max(active-1, 0));
      } else if (e.key === 'Home') { jump(0); }
      else if (e.key === 'End') { jump(REELS.length-1); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [active]);

  const jump = (i) => {
    const track = trackRef.current;
    const el = reelRefs.current[i];
    if (!track || !el) return;
    // Programmatic jump: set scrollTop directly. Scroll-snap will align it.
    track.scrollTop = el.offsetTop;
  };

  // Sync external stage counter
  useEffect(() => {
    const c = document.getElementById('stage-counter');
    if (c) c.textContent = `${String(active+1).padStart(2,'0')} / ${String(REELS.length).padStart(2,'0')}`;
  }, [active]);

  const restart = () => jump(0);

  return (
    <>
      <StatusBar/>
      <ActionRail onToast={onToast} onOpenSocials={onOpenSocials}/>
      <RailNav count={REELS.length} active={active} onJump={jump}/>
      {toastMsg && <Toast msg={toastMsg} onDone={() => setToastMsg(null)}/>}
      <SocialsSheet open={socialsOpen} onClose={onCloseSocials} onToast={onToast}/>
      {openBlogIdx !== null && (
        <BlogViewer blog={BLOGS[openBlogIdx]} onClose={onCloseBlog}/>
      )}
      <div className="reels" ref={trackRef}>
        {REELS.map((r, i) => (
          <section
            key={r.id}
            ref={el => reelRefs.current[i] = el}
            className={`reel reel-${r.id.split('-')[0]} ${active===i ? 'active' : ''}`}
            data-idx={i}
            data-screen-label={`${String(i+1).padStart(2,'0')} ${r.label}`}
          >
            <ReelCounter index={i} total={REELS.length} label={r.label}/>
            {r.render({ onRestart: restart, onOpenBlog })}
            <ReelFoot hint={i === REELS.length-1 ? 'restart ↑' : 'swipe up'}/>
          </section>
        ))}
        {/* Outro */}
        <section
          ref={el => reelRefs.current[REELS.length] = el}
          className="reel reel-outro"
          data-idx={REELS.length}
          data-screen-label={`${String(REELS.length+1).padStart(2,'0')} Outro`}
        >
          <ReelCounter index={REELS.length} total={REELS.length+1} label="End"/>
          <ReelOutro onRestart={restart}/>
          <ReelFoot hint="replay ↑"/>
        </section>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);

// -------- Tweaks wiring -----------------------------------------------
(function tweaks(){
  const body = document.body;
  // apply defaults
  body.dataset.variant = TWEAKS.variant;
  body.dataset.transition = TWEAKS.transition;

  const panel = document.getElementById('tweaks');
  const apply = (key, val) => {
    if (key === 'variant') body.dataset.variant = val;
    if (key === 'transition') body.dataset.transition = val;
    TWEAKS[key] = val;
  };
  panel.querySelectorAll('input[type=radio]').forEach(inp => {
    if (inp.value === TWEAKS[inp.name]) inp.checked = true;
    inp.addEventListener('change', () => apply(inp.name, inp.value));
  });
})();
</script>
</body>
</html>
